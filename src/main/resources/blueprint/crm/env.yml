elasticore:
  enable: true
  config:
    domainName: crm
    framework: springboot
    mode: jpa
    j2ee: jakarta
    apiPath: "/api"
    table:
      prefix: crm_
    referenceColumn: short
    # The browser client: ElastiCORE's TypeScript model plus the CRM's screen model
    # (crm-ui-rules writes src/main/ts/<Entity>Ui.ts and each enum's declaration order).
    publisher:
      rules:
        ts: [ts-model, io.elasticore.demo.rules.CrmUiRules]
    # The -- labels are Korean: the label bundle gets crm-labels_ko, and refusals answered in
    # Korean name the field, the entity and the state by them (env guide 6-3).
    labelLanguage: ko
    # An ArchUnit test of the hexagon's layer boundaries, written once and kept in step (env guide 6.1.3).
    archTest: true
    # HTTP contract tests of what the DSL declares (lifecycles, constraints, invariants), written
    # once and then the project's; every request goes through CrmContractSupport (ElastiCORE #295).
    testCode: "contract"
    # Every label of the model is also given in these languages (the build stops on one missing).
    crm:
      languages: en
    annotations:
      # Personal data answered masked (the stored value is kept as it is)
      maskphone: "@dto:io.elasticore.springboot3.mask.Mask(io.elasticore.springboot3.mask.MaskType.PHONE)"
      maskemail: "@dto:io.elasticore.springboot3.mask.Mask(io.elasticore.springboot3.mask.MaskType.EMAIL)"
  namespace:
    base: io.elasticore.demo.crm
