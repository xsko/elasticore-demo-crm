        datatype: Integer
        nonportable_extensions:
          - vendor_name: ELASTICORE
            data: {"domain": "crm", "declared": "wonDeals + lostDeals -- 마감된 영업 기회 수"}
      - name: winRate
        expression:
          sql: "CAST((COUNT(CASE WHEN stage = 'WON' THEN 1 END)) AS DECIMAL(38, 10)) / NULLIF(((COUNT(CASE WHEN stage = 'WON' THEN 1 END)) + (COUNT(CASE WHEN stage = 'LST' THEN 1 END))), 0)"
