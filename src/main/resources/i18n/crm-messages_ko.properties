# Korean wording of crm-messages.properties (generated beside it). Answered when the request's
# Accept-Language is ko (the screens send the language the user picked). A key missing here is
# said in its default (English) wording. A message with values ({0}) is a MessageFormat pattern.
#
# The rule refusals name things by their DSL labels in Korean (env.yml labelLanguage: ko), so a
# label changed in the DSL changes these sentences too:
#   invariant.*  {0} the field, {1} the entity
#   state.*      {2} the field, {3} the entity, {4} the current state, {5} the states it must be
#                ({0} and {1} are the same two states as codes)

